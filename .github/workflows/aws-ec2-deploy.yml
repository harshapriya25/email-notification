
name: Northstar Identity CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northstar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # JOB 1: CI BUILD AND VALIDATION
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Verify Gmail API dependency
        run: npm ls googleapis --prefix backend

      - name: Check required backend files
        run: |
          test -f backend/src/app.js
          test -f backend/src/server.js
          test -f backend/src/routes/auth.js
          test -f backend/src/routes/gmail.js
          test -f backend/src/routes/notifications.js

      - name: Check backend JavaScript syntax
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Prepare CI environment files
        run: |
          cp backend/.env.example backend/.env
          if [ -f frontend/.env.example ]; then
            cp frontend/.env.example frontend/.env
          fi

      - name: Validate Docker Compose
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:5000
        run: docker compose config -q

      - name: Check Git whitespace
        run: git diff --check

  # JOB 2: DEPLOY BACKEND TO AWS LAMBDA
  deploy-backend:
    name: Deploy Backend
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --template-file template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name northstar-prod \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  # JOB 3: DEPLOY FRONTEND TO S3 AND CLOUDFRONT
  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
