
name: Northstar Identity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northstar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Verify Gmail API dependency
        run: npm ls googleapis --prefix backend

      - name: Check required backend files
        run: |
          test -f backend/src/app.js
          test -f backend/src/server.js
          test -f backend/src/routes/auth.js
          test -f backend/src/routes/gmail.js
          test -f backend/src/routes/notifications.js

      - name: Check backend JavaScript syntax
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Prepare CI environment files
        run: |
          cp backend/.env.example backend/.env
          if [ -f frontend/.env.example ]; then
            cp frontend/.env.example frontend/.env
          fi

      - name: Validate Docker Compose configuration
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:5000
        run: docker compose config -q

      - name: Check Git whitespace errors
        run: git diff --check
